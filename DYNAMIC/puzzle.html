<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KVN Cross PJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;700&family=JetBrains+Mono:wght@700&family=Noto+Sans+Telugu:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/dynamic-puzzle.css?v=20260707i">
</head>
<body class="app-shell">
<div class="screen-splash screen-splash-primary" id="splashScreenOne" aria-hidden="false">
  <img class="splash-reference-image" src="assets/splash-screen-1.png" alt="KVN splash screen">
</div>

<div class="screen-splash screen-splash-secondary" id="splashScreenTwo" aria-hidden="true" hidden>
  <div class="splash-second-wrap">
    <img class="splash-reference-image" src="assets/splash-screen-2.png" alt="KVN second splash screen">
    <button type="button" id="startButton" class="start-button start-button-overlay">ప్రారంభించండి</button>
  </div>
</div>

<div class="game-shell" id="gameShell" hidden>
  <header class="game-hero">
    <div class="hero-poster-band">
      <div class="hero-leaf hero-leaf-left">❦</div>
      <div class="hero-brand">
        <h1>✦ KVN ✦</h1>
        <p class="hero-mainline">తెలుగు CROSS WORD PUZZLE</p>
        <div class="hero-divider">• ── ❃ ── •</div>
      </div>
      <div class="hero-leaf hero-leaf-right">❦</div>
    </div>

    <div class="hero-controls hero-controls-top">
      <div class="selector-group">
        <div class="selector-label">సూచిక</div>
        <div class="picker-card">
          <select id="folderSelect" aria-label="Select magazine"></select>
        </div>
      </div>

      <div class="selector-group">
        <div class="selector-label">సంఖ్య</div>
        <div class="picker-card">
          <select id="puzzleSelect" aria-label="Select puzzle"></select>
        </div>
      </div>
    </div>

    <div class="hero-controls hero-controls-bottom">
      <div class="action-cluster">
        <button type="button" id="previousButton" class="nav-chip">Previous</button>
        <button type="button" id="nextButton" class="nav-chip">Next</button>
      </div>

      <div class="current-puzzle-box">
        <div class="current-puzzle-label">ఈ వారం పజిల్స్</div>
        <div class="current-puzzle-title" id="puzzleTitle">KVN Cross PJ</div>
        <p id="puzzleSubtitle" class="current-puzzle-note">ఏ సంఖ్యపైనైనా నొక్కితే క్లూ కనిపిస్తుంది.</p>
      </div>

      <div class="action-cluster">
        <button type="button" id="undoButton" class="nav-chip">Undo</button>
        <button type="button" id="redoButton" class="nav-chip">Redo</button>
        <button type="button" id="clearButton" class="nav-chip danger-chip">Clear All</button>
        <button type="button" id="solutionButton" class="nav-chip" hidden>Solution</button>
      </div>
    </div>
  </header>

  <main class="game-stage">
    <div class="status-banner" id="statusBanner" hidden></div>
    <div class="loading-card" id="loadingCard">Loading puzzle...</div>

    <section class="play-stage">
      <div class="clue-preview-bar">
        <div class="clue-box clue-box-compact">
          <div class="clue-line">
            <span id="acrossLabel">- Across</span>
            <span class="detail muted" id="acrossText">No clue</span>
          </div>
        </div>

        <div class="clue-box clue-box-compact">
          <div class="clue-line">
            <span id="downLabel">- Down</span>
            <span class="detail muted" id="downText">No clue</span>
          </div>
        </div>
      </div>

      <div class="puzzle-shell">
        <div class="puzzle-frame">
          <img id="puzzleImage" alt="Puzzle image">
          <div id="grid"></div>
        </div>
      </div>
    </section>

  </main>
</div>

<div class="overlay" id="solutionOverlay" hidden>
  <div class="overlay-card">
    <button class="overlay-close" type="button" id="solutionClose" aria-label="Close solution">&times;</button>
    <img id="solutionImage" alt="Puzzle solution">
  </div>
</div>

<script src="assets/dynamic-puzzle.js?v=20260707i"></script>
</body>
</html>
